<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Proxy — Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a1f29;
    --panel-2: #232a36;
    --border: #2a3340;
    --text: #d6deeb;
    --muted: #7c869a;
    --accent: #7fdbca;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 36px 40px;
    width: min(400px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
  }
  .logo h1 {
    margin: 0; font-size: 18px; font-weight: 600; color: var(--text);
  }
  .logo span { color: var(--muted); font-size: 13px; margin-left: 2px; }
  label {
    display: block; color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px;
  }
  input[type="password"] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 13px; font-size: 14px; font-family: inherit;
    outline: none; transition: border-color .15s;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  .error-msg {
    background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3);
    color: var(--err); border-radius: 6px;
    padding: 9px 13px; font-size: 13px; margin-bottom: 18px;
    display: none;
  }
  .error-msg.show { display: block; }
  button[type="submit"] {
    width: 100%; margin-top: 18px;
    background: var(--accent); color: #0f1419;
    border: none; border-radius: 7px;
    padding: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: opacity .15s;
  }
  button[type="submit"]:hover { opacity: .88; }
  .footer {
    margin-top: 20px; text-align: center; color: var(--muted); font-size: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-dot"></span>
    <h1>AI Proxy <span>Dashboard</span></h1>
  </div>

  <div id="errMsg" class="error-msg">Incorrect password. Please try again.</div>

  <form method="POST" action="/dashboard/login">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" placeholder="Enter dashboard password">
    <button type="submit">Sign in</button>
  </form>

  <div class="footer">Set <code>DASHBOARD_PASSWORD</code> in your .env file</div>
</div>

<script>
  // Show error banner when ?error=1 is in the URL
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('errMsg').classList.add('show');
  }
</script>
</body>
</html>

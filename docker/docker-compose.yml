services:
  ai-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-proxy
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ../.env
    # Persistent storage for static reply rules, request logs, and app events.
    # Survives container restart and rebuild. Inspect/back up files in ../data/.
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
